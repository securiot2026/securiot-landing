server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page and its code must revalidate on every visit. CSS and JS keep fixed
    # file names, so a long immutable cache served stale styles next to new HTML.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Images and fonts change rarely and are replaced under new names.
    location ~* \.(?:woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
